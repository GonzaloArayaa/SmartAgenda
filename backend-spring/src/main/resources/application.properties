server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartagenda_pro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USERNAME:smartagenda}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.default-property-inclusion=non_null
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Foto de perfil: el controlador exige hasta 2 MB; este tope es el del servidor (un poco mayor)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Flyway crea y actualiza la base al iniciar el backend (scripts en db/migration).
# Una base que ya existe y todavía no tiene historial de Flyway se toma como "al día" hasta la V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
